allowBuilds:
  esbuild: false

autoInstallPeers: false

blockExoticSubdeps: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@mysten/*'

# Keep any resolved Rollup/YAML dependencies and AJV's URI parser on patched releases.
overrides:
  'rollup@>=4.0.0 <4.59.0': '^4.64.12'
  'yaml@>=2.0.0 <2.8.3': '^2.9.1'
  'fast-uri@>=3.0.0 <3.1.8': '^3.1.8'
