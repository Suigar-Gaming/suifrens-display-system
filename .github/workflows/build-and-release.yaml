name: Build and release package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: &runner ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      version: ${{ steps.plan.outputs.version }}
      version-changed: ${{ steps.plan.outputs.version-changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js and pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - name: Check pnpm installation
        run: pnpm doctor
      - name: Check package manifests
        run: pnpm exec manypkg check
      - name: Read release plan
        id: plan
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/release-plan.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+$/);
          const { changesets } = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-plan.json`, 'utf8'));
          const pending = changesets.length > 0;
          let changed = false;
          if (process.env.PREVIOUS_SHA && !/^0+$/.test(process.env.PREVIOUS_SHA)) {
            const previous = JSON.parse(execFileSync('git', ['show', `${process.env.PREVIOUS_SHA}:package.json`], { encoding: 'utf8' }));
            changed = previous.version !== version;
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `pending=${pending}\nversion=${version}\nversion-changed=${changed}\n`);
          JS
      - name: Check lint and formatting
        run: pnpm lint
      - name: Check TypeScript types
        run: pnpm typecheck
      - name: Build library
        run: pnpm build
      - name: Run unit and package tests
        run: pnpm test
      - name: Build Storybook
        run: pnpm build:storybook
      - name: Verify generated assets match sources
        run: git diff --exit-code
      - name: Pack versioned release archive
        if: steps.plan.outputs.pending == 'false'
        run: node scripts/pack-release.mjs
      - name: Upload release archive
        if: steps.plan.outputs.pending == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: artifacts/*
          if-no-files-found: error
  release:
    if: >-
      github.ref == 'refs/heads/main' && (needs.validate.outputs.pending == 'true' || needs.validate.outputs.version-changed == 'true' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: *runner
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js and pnpm
        if: needs.validate.outputs.pending == 'true'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - name: Create or update version pull request
        if: needs.validate.outputs.pending == 'true'
        id: changesets
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm changeset version
          commit-message: 'ci: version package'
          pr-title: 'ci: version package'
          pr-base-branch: main
      - name: Validate version pull request
        if: needs.validate.outputs.pending == 'true' && steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          release_branch=$(gh pr view "$RELEASE_PR" --json headRefName --jq '.headRefName')
          gh workflow run build-and-release.yaml --ref "$release_branch"
      - name: Download release archive
        if: needs.validate.outputs.pending == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifacts
      - name: Publish versioned GitHub archive
        if: needs.validate.outputs.pending == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" artifacts/*.tgz artifacts/*.sha256 \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file artifacts/RELEASE_NOTES.md
