name: Build and release package
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js and pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.22.1
          cache: true
          install: false
      - name: Check pnpm installation
        run: pnpm doctor
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check lint and formatting
        run: pnpm lint
      - name: Check TypeScript types
        run: pnpm typecheck
      - name: Build and pack compiled release archive
        run: pnpm release:pack
      - name: Run unit and package tests
        run: pnpm test
      - name: Build Storybook
        run: pnpm build:storybook
      - name: Check tag and build provenance
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          JS
      - name: Verify generated assets match the tagged sources
        if: startsWith(github.ref, 'refs/tags/')
        run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: package
          path: artifacts
      - name: Publish versioned archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.tgz artifacts/*.sha256 --verify-tag --title "$RELEASE_TAG" --notes-file artifacts/RELEASE_NOTES.md
